<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSCLE HUB BOT</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
       font-family: Arial, sans-serif;
       background-color: #000000;
       height: 100vh;
       margin: 0;
       display: flex;
       justify-content: center;
       align-items: center;
       overflow-x: hidden;
    }

    .chat-container {
       width: 900px;
       height: 90%;
       background-color: transparent;
       padding: 20px;
       border-radius: 8px;
       display: flex;
       flex-direction: column;
    }

    .chat-box {
      flex-grow: 1;
      overflow-y: auto;
      padding: 10px;
      background-color: transparent;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
    }

    .chat-box .message {
      margin: 5px 0;
      padding: 10px;
      border-radius: 8px;
      max-width: 75%;
    }

    .message.user {
      color: white;
      align-self: flex-end;
      text-align: justify;
      font-weight: 700;
      font-size: 16px;
    }

    .message.bot {
      color: white;
      align-self: flex-start;
      text-align: left;
      font-weight: 700;
      font-size: 16px;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    .input-area input {
      width: 100%;
      height: 40px;
      background: black;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 20px;
      outline: none;
    }

    .input-area button {
      padding: 10px;
      background-color: #f1b8b8;
      color: white;
      width: 50px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      height: 40px;
      transition: background-color 0.3s ease;
    }

    .input-area button:hover {
      background-color: #ff1e1e;
    }

  </style>
</head>
<body>
  <header>
    <nav>
        <div class="logo">
            <a href="index.html">Muscle <span>Hub</span></a>
        </div>
</nav>
</header>

  <div class="chat-container">
    <div class="chat-box" id="chat-box">
      <!-- Chat messages will appear here -->
    </div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Type a message..." />
      <button id="voice-btn" onclick="startVoiceRecognition()">🎤</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    let recognition;
    let isVoiceInput = false; // Flag to track if the message is from voice input

    if ('webkitSpeechRecognition' in window) {
      recognition = new webkitSpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript; 
        isVoiceInput = true; // Set flag to true when voice input is used
        sendMessage();  
      };

      recognition.onerror = function(event) {
        console.log('Speech recognition error', event.error);
        alert('Sorry, I couldn\'t understand your voice. Please try again.');
      };
    } else {
      alert('Speech recognition is not supported in this browser.');
    }

    function startVoiceRecognition() {
      if (recognition) {
        recognition.start();
      } else {
        alert('Voice recognition is not supported in this browser.');
      }
    }

    function sendMessage() {
      const userMessage = userInput.value.trim();
      if (userMessage !== "") {
        displayMessage(userMessage, "user");
        userInput.value = "";

        setTimeout(() => {
          const botResponse = getBotResponse(userMessage);
          displayMessageWithTypingEffect(botResponse, "bot");
          
          // Speak response only if input was voice-based
          if (isVoiceInput) {
            speak(botResponse);
          }

          isVoiceInput = false; // Reset flag after response
        }, 1000);
      }
    }

    function displayMessage(message, sender) {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message', sender);
      messageDiv.innerHTML = sender === "bot" ? message : message.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function displayMessageWithTypingEffect(message, sender) {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message', sender);
      chatBox.appendChild(messageDiv);

      let content = message;
      let index = 0;
      const typingSpeed = 30;

      const typingInterval = setInterval(() => {
        messageDiv.innerHTML = content.substring(0, index);
        index++;

        if (index > content.length) {
          clearInterval(typingInterval);
        }
      }, typingSpeed);
    }

    function speak(text) {
      const speech = new SpeechSynthesisUtterance();
      speech.text = text;
      speech.lang = 'en-US';
      speech.volume = 1;
      speech.rate = 1;
      speech.pitch = 1;
      window.speechSynthesis.speak(speech);
    }

    const responseMap = {
    "hello": "Hello! Welcome to Muscle Hub. How can I assist you today? 💪",
      "hi": "Hey there! Need help with your workouts? 🏋️",
      "website features": `
        <ul>
          <li><strong>✅ Custom Workout Plans:</strong> Tailored to your fitness goals.</li>
          <li><strong>🎥 Video Tutorials:</strong> Step-by-step exercise guides.</li>
          <li><strong>📈 Progress Tracker:</strong> Monitor your improvements.</li>
          <li><strong>💬 Community Forum:</strong> Connect with fitness enthusiasts.</li>
          <li><strong>🏋️ Online Class Booking:</strong> Reserve gym classes & sessions.</li>
          <li><strong>💳 Flexible Memberships:</strong> Monthly, quarterly, yearly plans.</li>
          <li><strong>📞 24/7 Support:</strong> Contact us anytime!</li>
        </ul>`,
      "goodbye": "Thanks for visiting Muscle Hub! Stay strong and keep pushing! 💪🔥",
      "bye": "Thanks for visiting Muscle Hub! Stay strong and keep pushing! 💪🔥",
      "who are you": "I'm Muscle Hub's chatbot assistant! Here to help with your fitness journey. 🤖",
      "default": "Sorry, I didn't understand that. Can you rephrase? Try the name of part to workout🤔",
      "abdominals": "<a href='part.html?muscle=Abdominals' target='_blank'>Click here </A>to see the workout for abdominals",
      "back workout": "<a href='part.html?muscle=back' target='_blank'>Click here </A>to see the workout for back",
      "biceps": "<a href='part.html?muscle=biceps' target='_blank'>Click here </A>to see the workout for biceps",
      "chest": "<a href='part.html?muscle=chest' target='_blank'>Click here </A>to see the workout for chest",  
      "forearms": "<a href='part.html?muscle=forearms' target='_blank'>Click here </A>to see the workout for forearms",
      "legs": "<a href='part.html?muscle=legs' target='_blank'>Click here </A>to see the workout for legs",
      "shoulders": "<a href='part.html?muscle=shoulders' target='_blank'>Click here </A>to see the workout for shoulders",
      "triceps": "<a href='part.html?muscle=triceps' target='_blank'>Click here </A>to see the workout for triceps",
      "full body": "<a href='part.html?muscle=full body' target='_blank'>Click here </A>to see the workout for full body",
      "cardio": "<a href='part.html?muscle=cardio' target='_blank'>Click here </A>to see the workout for cardio", 
      "weight loss": "<a href='part.html?muscle=weight loss' target='_blank'>Click here </A>to see the workout for weight loss",
      "weight gain": "<a href='part.html?muscle=weight gain' target='_blank'>Click here </A>to see the workout for weight gain",
      "muscle gain": "<a href='part.html?muscle=muscle gain' target='_blank'>Click here </A>to see the workout for muscle gain",
      "strength": "<a href='part.html?muscle=strength' target='_blank'>Click here </A>to see the workout for strength",
      "cardio": "<a href='part.html?muscle=cardio' target='_blank'>Click here </A>to see the workout for cardio",
      "yoga": "<a href='part.html?muscle=yoga' target='_blank'>Click here </A>to see the workout for yoga",
      "pilates": "<a href='part.html?muscle=pilates' target='_blank'>Click here </A>to see the workout for pilates",
      "zumba": "<a href='part.html?muscle=zumba' target='_blank'>Click here </A>to see the workout for zumba",
      "aerobics": "<a href='part.html?muscle=aerobics' target='_blank'>Click here </A>to see the workout for aerobics",
      "cycling": "<a href='part.html?muscle=cycling' target='_blank'>Click here </A>to see the workout for cycling",
        "swimming": "<a href='part.html?muscle=swimming' target='_blank'>Click here </A>to see the workout for swimming",
      "running": "<a href='part.html?muscle=running' target='_blank'>Click here </A>to see the workout for running",
        " default": "Sorry, I didn't understand that. Try asking about a workout. 🤔"
    };
    function getBotResponse(userMessage) {
      const normalizedMessage = userMessage.toLowerCase();
      return responseMap[normalizedMessage] || responseMap["default"];
    }

    userInput.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        isVoiceInput = false; // Reset flag if user types
        sendMessage();
      }
    });

    window.onload = function() {
      userInput.focus();
    };
  </script>

</body>
</html>
