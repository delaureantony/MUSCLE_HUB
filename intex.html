<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muscle Hub – Interactive Body Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #13161d;
      --border:    #1f2330;
      --accent:    #c11325;
      --accent2:   #ff3348;
      --body-fill: #2a2e3d;
      --muscle:    #c11325;
      --muscle-h:  #ff3348;
      --model:     #3a3f52;
      --text:      #e8eaf0;
      --muted:     #6b7080;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(13,15,20,.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.9rem;
      letter-spacing: .08em;
      color: var(--text);
      text-decoration: none;
    }
    .logo span { color: var(--accent); }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: .85rem;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      transition: color .2s;
    }
    nav a:hover { color: var(--accent2); }

    /* ── PAGE LAYOUT ── */
    .page {
      padding-top: 64px;
      min-height: 100vh;
    }

    .hero-bar {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
    }
    .hero-bar h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      letter-spacing: .12em;
      color: var(--text);
    }
    .hero-bar p {
      margin-top: .4rem;
      font-size: .88rem;
      color: var(--muted);
      letter-spacing: .04em;
    }
    .accent-line {
      width: 48px; height: 3px;
      background: var(--accent);
      margin: .8rem auto 0;
      border-radius: 2px;
    }

    /* ── BODY-MAP GRID ── */
    .map-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      max-width: 860px;
      margin: 1.5rem auto 3rem;
      padding: 0 1rem;
    }

    .map-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      transition: border-color .25s;
    }
    .map-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(193,19,37,.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .map-card:hover { border-color: rgba(193,19,37,.5); }

    .map-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: .95rem;
      letter-spacing: .18em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: .75rem;
    }

    /* ── SVG STYLES ── */
    svg { display: block; width: 100%; height: auto; max-height: 620px; }

    /* Model base body */
    .body-map__model path { fill: var(--model); transition: fill .2s; }

    /* Muscles – solid fill, no transparency */
    .body-map__muscle path {
      fill: var(--muscle);
      transition: fill .18s, filter .18s, transform .18s;
      cursor: pointer;
    }

    /* Hover glow per muscle group */
    .body-map__muscle a:hover path,
    .body-map__muscle path:hover {
      fill: var(--muscle-h);
      filter: drop-shadow(0 0 8px rgba(255,51,72,.7));
    }

    /* Pulse animation on page load — staggers in */
    @keyframes musclePop {
      0%   { opacity: 0; transform: scale(.94); }
      60%  { opacity: 1; transform: scale(1.025); }
      100% { transform: scale(1); opacity: 1; }
    }

    .body-map__muscle {
      animation: musclePop .55s cubic-bezier(.23,1,.32,1) both;
    }
    #abdominals   { animation-delay: .05s; }
    #obliques     { animation-delay: .10s; }
    #chest        { animation-delay: .12s; }
    #biceps       { animation-delay: .15s; }
    #shoulders    { animation-delay: .18s; }
    #traps        { animation-delay: .20s; }
    #forearms     { animation-delay: .23s; }
    #quads        { animation-delay: .27s; }
    #calves       { animation-delay: .32s; }

    /* Back SVG */
    #hamstrings   { animation-delay: .08s; }
    #lowerback    { animation-delay: .12s; }
    #glutes       { animation-delay: .16s; }
    #lats         { animation-delay: .20s; }
    #traps_middle { animation-delay: .24s; }
    #triceps      { animation-delay: .28s; }

    /* Tooltip */
    .tooltip {
      position: fixed;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: .45rem .9rem;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--accent2);
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .15s, transform .15s;
      z-index: 999;
      white-space: nowrap;
    }
    .tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── LEGEND ── */
    .legend {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .78rem;
      color: var(--muted);
      letter-spacing: .04em;
    }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 2px;
    }
    .dot-muscle { background: var(--muscle); }
    .dot-body   { background: var(--model); }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .map-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <a class="logo" href="index.html">Muscle<span>Hub</span></a>
  <nav>
    <a href="gymassis.html">AI Assistant</a>
  </nav>
</header>

<div class="page">

  </div>

<!-- Tooltip -->
<div class="tooltip" id="tooltip"></div>

<script>
  const tooltip = document.getElementById('tooltip');

  document.querySelectorAll('.body-map__muscle').forEach(group => {
    const muscle = group.dataset.muscle || group.id.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

    group.addEventListener('mouseenter', e => {
      tooltip.textContent = muscle;
      tooltip.classList.add('visible');
    });
    group.addEventListener('mousemove', e => {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY - 32) + 'px';
    });
    group.addEventListener('mouseleave', () => {
      tooltip.classList.remove('visible');
    });
  });
</script>
