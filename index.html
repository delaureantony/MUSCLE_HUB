<!DOCTYPE html>
<html>
<head>
    <title>Muscle Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <style>
        .wow:first-child {
            visibility: visible !important;
        }
        /* Style for the Start button */
        .start-button {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 18px;
            color: #fff;
            background-color: #be1f1fd2;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .start-button:hover {
            background-color: #ff0000;
        }
        /* Hidden containers */
        .hidden-container1 {
            position: fixed;
            bottom: 20px;
            left: 1px;
            width: 200px;
            height: 200px;
            background-color: #fffefe00;
            background-image: url(ct1.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            color: white;
            padding: 10px;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .hidden-container2 {
            position: fixed;
            bottom: 1px;
            left: 20px;
            width: 200px;
            height: 200px;
            background-color: #f6eded00;
            background-image: url(ct2.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            color: white;
            padding: 10px;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .hidden-container3 {
            position: fixed;
            bottom: 1px;
            left: 20px;
            width: 200px;
            height: 200px;
            background-color: #14111100;
            background-image: url(ct3.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            color: white;
            padding: 10px;
            border-radius: 5px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color:#c1132400;
            color: rgb(255, 3, 3);
            border: none;
            border-radius: 8px;
            font-size: 24px;
            cursor: pointer;
            margin-top: 0px;
        }

        button:hover {
            background-color:#f6051d;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <!-- Start Header -->
    <header>
        <nav>
            <div class="logo">
                <a href="">Muscle <span>Hub</span></a>
            </div>
            <div class="right-nav">
                <span><a href="login.html"><button id="loginBtn">Login</button></a></span>
                <span><a href="gymassis.html"><img src="chatbot.svg" alt="Chatbot" id="chatbotimg"></a></span>
            </div>
        </nav>
    </header>
    <!-- End Header -->
    <br>
    <!-- Start Home -->
    <section class="home wow flash" id="home">
        <div class="container">
            <h1 class="wow slideInLeft" data-wow-delay="1s">It's <span>gym</span> time. Let's go</h1>
            <h1 class="wow slideInRight" data-wow-delay="1s">We are ready to <span>fit you</span></h1><br>
            <center>
                <select id="options" class="select-box" data-wow-delay="3s">
                    <option value="">Select an option</option>
                    <option value="workout">Workout Plans With BMI</option>
                    <option value="nutrition">General Workouts</option>
                    <option value="yoga">YOGA</option>
                </select>
            </center>
            <a href="#" id="start-btn">
                <h2 class="start-button wow fadeInUp" data-wow-delay="2s"><br><center>START</center></h2>
            </a>
        </div>
    </section>
    <!-- End Home -->
    
    <!-- Hidden Containers -->
    <div id="container1" class="hidden-container1"></div>
    <div id="container2" class="hidden-container2"></div>
    <div id="container3" class="hidden-container3"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="js/wow.min.js"></script>
    <script>
        wow = new WOW({
            animateClass: 'animated',
            offset: 0,
        });
        wow.init();
    </script>
    <script>
        document.getElementById('start-btn').addEventListener('click', function(event) {
            event.preventDefault(); // Prevent default link behavior
            const selectedOption = document.getElementById('options').value;

            if (selectedOption === 'workout') {
                window.location.href = 'bmi.html';
            } else if (selectedOption === 'nutrition') {
                window.location.href = 'intex.html';
            }else if (selectedOption === 'yoga') {
                alert(' The page is under constraction ')
            } else {
                alert('Please select the workout system');
            }
        });

       
        function toggleContainers() {
    let visibleIndex = 0;
    const containers = [
        document.getElementById('container1'),
        document.getElementById('container2'),
        document.getElementById('container3')
    ];

    // Initially hide all containers
    containers.forEach(container => {
        container.style.opacity = '0';
        container.style.transition = 'opacity 1.5s ease-in-out, transform 1.5s ease-in-out';
        container.style.transform = 'scale(0.8)';
    });

    setInterval(() => {
        // Hide all containers
        containers.forEach(container => {
            container.style.opacity = '0';
            container.style.transform = 'scale(0.8)';
        });
        
        // Show the next container with animation
        containers[visibleIndex].style.opacity = '1';
        containers[visibleIndex].style.transform = 'scale(1)';
        
        // Move to the next container
        visibleIndex = (visibleIndex + 1) % containers.length;
    }, 5000);
}


        // Trigger function when page loads
        window.onload = () => {
            document.getElementById('container1').style.display = 'block';
            document.getElementById('container2').style.display = 'block';
            toggleContainers();
        };
    </script>
</body>
</html>
